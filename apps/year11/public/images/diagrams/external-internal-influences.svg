<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="External and internal business influences">
  <rect width="640" height="360" fill="#f8fafc" rx="12"/>
  <rect x="40" y="40" width="260" height="280" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="170" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#991b1b">External</text>
  <text x="170" y="92" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#b91c1c">Little control</text>
  <text x="60" y="130" font-family="system-ui,sans-serif" font-size="12" fill="#7f1d1d">- Economic / Financial</text>
  <text x="60" y="152" font-family="system-ui,sans-serif" font-size="12" fill="#7f1d1d">- Geographic / Social</text>
  <text x="60" y="174" font-family="system-ui,sans-serif" font-size="12" fill="#7f1d1d">- Legal / Political</text>
  <text x="60" y="196" font-family="system-ui,sans-serif" font-size="12" fill="#7f1d1d">- Institutional</text>
  <text x="60" y="218" font-family="system-ui,sans-serif" font-size="12" fill="#7f1d1d">- Technological</text>
  <text x="60" y="240" font-family="system-ui,sans-serif" font-size="12" fill="#7f1d1d">- Competitive situation</text>
  <rect x="340" y="40" width="260" height="280" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="470" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#065f46">Internal</text>
  <text x="470" y="92" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#047857">Can adjust via management</text>
  <text x="360" y="130" font-family="system-ui,sans-serif" font-size="12" fill="#064e3b">- Product mix</text>
  <text x="360" y="152" font-family="system-ui,sans-serif" font-size="12" fill="#064e3b">- Location</text>
  <text x="360" y="174" font-family="system-ui,sans-serif" font-size="12" fill="#064e3b">- Resources / Finance</text>
  <text x="360" y="196" font-family="system-ui,sans-serif" font-size="12" fill="#064e3b">- Management decisions</text>
  <text x="360" y="218" font-family="system-ui,sans-serif" font-size="12" fill="#064e3b">- Business culture</text>
  <rect x="260" y="140" width="120" height="80" rx="40" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/>
  <text x="320" y="178" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#3730a3">Business</text>
  <text x="320" y="198" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#4f46e5">Operations</text>
</svg>
